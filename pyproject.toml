[project]
name = "text2sql"
version = "0.1.0"
description = "Production-ready Text-to-SQL Assistant with FastAPI, Streamlit, and PostgreSQL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "google-genai>=0.1.1",
    "httpx>=0.27.0",
    "openai>=1.14.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.28",
    "sqlglot>=23.0.0",
    "streamlit>=1.32.0",
    "uvicorn[standard]>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "text2sql"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
